<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador de productos por SKU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .desc { white-space: pre-line; }
    .thumb { width: 110px; height: 110px; object-fit: contain; background: #fff; border: 1px solid #dee2e6; border-radius: .5rem; }
    .attr-key { width: 35%; text-transform: capitalize; }
  </style>
</head>
<body>
  <div class="container py-4" style="max-width: 900px;">

    <div id="loginScreen" class="card shadow-sm mx-auto" style="max-width: 380px;">
      <div class="card-body">
        <h5 class="card-title mb-3">Acceso</h5>
        <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Contraseña" autocomplete="current-password">
        <div id="loginError" class="text-danger small mb-2 d-none">Contraseña incorrecta.</div>
        <button id="btnLogin" class="btn btn-primary w-100">Ingresar</button>
      </div>
    </div>

    <div id="appContent" class="d-none">
      <h4 class="mb-3">Buscador de productos por SKU</h4>

      <form id="searchForm" class="input-group mb-3">
        <input type="text" id="skuInput" class="form-control" placeholder="Ingresá el SKU" autocomplete="off" required>
        <button class="btn btn-primary" type="submit" id="btnSearch">Buscar</button>
      </form>

      <div id="status" class="alert d-none"></div>
      <div id="suggestions" class="list-group mb-3 d-none"></div>
      <div id="result" class="d-none"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    let password = sessionStorage.getItem('buscador_pw') || '';
    let currentProduct = null;

    const $ = id => document.getElementById(id);
    const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => '$ ' + Number(n).toLocaleString('es-AR');
    const prettyKey = k => String(k).replace(/_/g, ' ');

    function logout() {
      sessionStorage.removeItem('buscador_pw');
      password = '';
      location.reload();
    }

    async function api(path) {
      const r = await fetch(path, { headers: { 'x-access-password': password } });
      if (r.status === 401) { logout(); throw new Error('Sesión expirada'); }
      return r;
    }

    function setStatus(msg, type = 'info') {
      const el = $('status');
      if (!msg) { el.classList.add('d-none'); return; }
      el.className = `alert alert-${type}`;
      el.textContent = msg;
    }

    function unlock() {
      $('loginScreen').classList.add('d-none');
      $('appContent').classList.remove('d-none');
      $('skuInput').focus();
    }

    $('btnLogin').addEventListener('click', async () => {
      const pass = $('loginPassword').value;
      let ok = false;
      try { ok = (await fetch('/api/search?ping=1', { headers: { 'x-access-password': pass } })).ok; } catch (e) { ok = false; }
      if (ok) {
        password = pass;
        sessionStorage.setItem('buscador_pw', pass);
        unlock();
        const sku = new URLSearchParams(location.search).get('sku');
        if (sku) { $('skuInput').value = sku; search(sku); }
      } else {
        $('loginError').classList.remove('d-none');
      }
    });
    $('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });

    window.addEventListener('DOMContentLoaded', () => {
      if (!password) return;
      unlock();
      const sku = new URLSearchParams(location.search).get('sku');
      if (sku) { $('skuInput').value = sku; search(sku); }
    });

    $('searchForm').addEventListener('submit', e => {
      e.preventDefault();
      search($('skuInput').value.trim());
    });

    async function search(sku) {
      if (!sku) return;
      setStatus(null);
      $('result').classList.add('d-none');
      $('suggestions').classList.add('d-none');
      currentProduct = null;
      $('btnSearch').disabled = true;
      try {
        const r = await api('/api/search?sku=' + encodeURIComponent(sku));
        const data = await r.json();
        if (!data.success) throw new Error(data.error || 'Error');
        if (data.product) return renderProduct(data.product);

        if (!data.suggestions.length) return setStatus(`No se encontró ningún producto con el SKU "${sku}".`, 'warning');
        setStatus(`No existe el SKU "${sku}". ¿Quisiste decir alguno de estos?`, 'warning');
        $('suggestions').innerHTML = data.suggestions.map(p =>
          `<button type="button" class="list-group-item list-group-item-action" data-sku="${escapeHtml(p.sku)}">
             <strong>${escapeHtml(p.sku)}</strong> - ${escapeHtml(p.nombre || '')}</button>`).join('');
        $('suggestions').classList.remove('d-none');
      } catch (e) {
        setStatus('Error al consultar: ' + e.message, 'danger');
      } finally {
        $('btnSearch').disabled = false;
      }
    }

    $('suggestions').addEventListener('click', e => {
      const b = e.target.closest('[data-sku]');
      if (b) { $('skuInput').value = b.dataset.sku; search(b.dataset.sku); }
    });

    function row(label, value) {
      if (value === undefined || value === null || value === '') return '';
      return `<dt class="col-sm-4">${escapeHtml(label)}</dt><dd class="col-sm-8">${escapeHtml(value)}</dd>`;
    }

    function renderProduct(p) {
      currentProduct = p;
      const attrs = Object.entries(p.catalogo?.atributos || {});
      const sucursales = Object.entries(p.logistica?.stock_por_sucursal || {});
      const imgs = (p.catalogo?.imagenes || []).filter(u => /^https:\/\//i.test(u));
      const safeUrl = /^https:\/\//i.test(p.url || '') ? p.url : null;

      $('result').innerHTML = `
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between gap-2 mb-2">
              <div>
                <h5 class="mb-1">${escapeHtml(p.nombre || '(sin nombre)')}</h5>
                <div class="text-muted small">SKU: <span class="font-monospace">${escapeHtml(p.sku)}</span>
                  ${p.parent_sku ? ` · Padre: <a href="?sku=${encodeURIComponent(p.parent_sku)}">${escapeHtml(p.parent_sku)}</a>` : ''}
                  ${p.habilitado === false ? ' · <span class="badge text-bg-secondary">Deshabilitado</span>' : ''}</div>
              </div>
              <div class="d-flex gap-2 align-self-start">
                ${safeUrl ? `<a class="btn btn-outline-secondary btn-sm" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener">Ver en tienda</a>` : ''}
                <button class="btn btn-danger btn-sm" id="btnPdf">Descargar PDF</button>
              </div>
            </div>

            ${imgs.length ? `<div class="d-flex gap-2 flex-wrap mb-3">${imgs.slice(0, 6).map(u =>
              `<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="${escapeHtml(u)}" alt="">`).join('')}</div>` : ''}

            <dl class="row small mb-3">
              ${row('Marca', p.marca)}
              ${row('Categoría', p.categoria)}
              ${row('Precio lista', p.pricing?.precio_lista != null ? money(p.pricing.precio_lista) : null)}
              ${row('Precio un pago', p.pricing?.precio_un_pago != null ? money(p.pricing.precio_un_pago) : null)}
              ${row('Cuotas sin interés', p.pricing?.cuotas_sin_interes)}
              ${row('Stock', p.logistica?.stock)}
              ${row('Stock por sucursal', sucursales.map(([n, q]) => `${n}: ${q}`).join(' · ') || null)}
              ${row('Actualizado', p.updated_at ? new Date(p.updated_at).toLocaleString('es-AR') : null)}
            </dl>

            <h6>Descripción</h6>
            <p class="desc small">${p.catalogo?.descripcion ? escapeHtml(p.catalogo.descripcion) : '<span class="text-muted">Sin descripción.</span>'}</p>

            <h6>Atributos</h6>
            ${attrs.length ? `<table class="table table-sm table-striped small"><tbody>${attrs.map(([k, v]) =>
              `<tr><td class="attr-key fw-semibold">${escapeHtml(prettyKey(k))}</td><td>${escapeHtml(v)}</td></tr>`).join('')}</tbody></table>`
              : '<p class="text-muted small">Sin atributos.</p>'}
          </div>
        </div>`;
      $('result').classList.remove('d-none');
      $('btnPdf').addEventListener('click', () => downloadPdf(currentProduct, $('btnPdf')));
    }

    // Las fuentes estándar de jsPDF solo cubren Latin-1: se reemplazan símbolos habituales fuera de ese rango
    const pdfText = s => String(s ?? '')
      .replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
      .replace(/[\u2013\u2014]/g, '-').replace(/\u2022/g, '-').replace(/\u2026/g, '...')
      .replace(/[^\x09\x0A\x20-\x7E\u00A0-\u00FF]/g, '');

    // Descarga la imagen vía proxy y la rasteriza a JPEG (cubre webp/png/gif) para incrustarla
    async function loadImage(url) {
      try {
        const r = await fetch('/api/image?url=' + encodeURIComponent(url), { headers: { 'x-access-password': password } });
        if (!r.ok) return null;
        const bmp = await createImageBitmap(await r.blob());
        const canvas = document.createElement('canvas');
        canvas.width = bmp.width; canvas.height = bmp.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bmp, 0, 0);
        return { data: canvas.toDataURL('image/jpeg', 0.85), w: bmp.width, h: bmp.height };
      } catch (e) {
        return null;
      }
    }

    async function downloadPdf(p, btn) {
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Generando...';
      try {
        const urls = (p.catalogo?.imagenes || []).filter(u => /^https:\/\//i.test(u)).slice(0, 6);
        const images = (await Promise.all(urls.map(loadImage))).filter(Boolean);
        buildPdf(p, images);
      } finally {
        btn.disabled = false;
        btn.textContent = label;
      }
    }

    function buildPdf(p, images) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const M = 15, W = doc.internal.pageSize.getWidth() - M * 2, H = doc.internal.pageSize.getHeight();
      let y = M;

      const ensure = h => { if (y + h > H - M) { doc.addPage(); y = M; } };
      const write = (text, { size = 10, bold = false, gap = 1.5 } = {}) => {
        doc.setFont('helvetica', bold ? 'bold' : 'normal').setFontSize(size);
        const lh = size * 0.4;
        for (const line of doc.splitTextToSize(pdfText(text), W)) {
          ensure(lh);
          y += lh;
          doc.text(line, M, y);
        }
        y += gap;
      };
      const title = t => { y += 3; ensure(12); write(t, { size: 12, bold: true, gap: 1 }); doc.setDrawColor(180).line(M, y, M + W, y); y += 3; };

      write('Ficha de producto', { size: 9, gap: 3 });
      title('Nombre');
      write(p.nombre || '-', { size: 13, bold: true });
      title('SKU');
      write(p.sku || '-', { size: 11 });

      if (images.length) {
        title('Imágenes');
        const cols = 3, gapX = 4, cell = (W - gapX * (cols - 1)) / cols;
        images.forEach((img, i) => {
          const col = i % cols;
          if (col === 0) ensure(cell + 4);
          const scale = Math.min(cell / img.w, cell / img.h);
          const w = img.w * scale, h = img.h * scale;
          const x = M + col * (cell + gapX) + (cell - w) / 2;
          doc.addImage(img.data, 'JPEG', x, y + (cell - h) / 2, w, h);
          if (col === cols - 1 || i === images.length - 1) y += cell + 4;
        });
      }

      title('Descripción');
      write(p.catalogo?.descripcion || 'Sin descripción.');
      title('Atributos');
      const attrs = Object.entries(p.catalogo?.atributos || {});
      if (!attrs.length) write('Sin atributos.');
      const keyW = 55, lh = 10 * 0.4;
      for (const [k, v] of attrs) {
        const keyLines = doc.setFont('helvetica', 'bold').setFontSize(10).splitTextToSize(pdfText(prettyKey(k)), keyW - 3);
        const valLines = doc.setFont('helvetica', 'normal').splitTextToSize(pdfText(v), W - keyW);
        const lines = Math.max(keyLines.length, valLines.length);
        ensure(lines * lh + 1.5);
        doc.setFont('helvetica', 'bold').text(keyLines, M, y + lh);
        doc.setFont('helvetica', 'normal').text(valLines, M + keyW, y + lh);
        y += lines * lh + 1.5;
      }

      const total = doc.getNumberOfPages();
      for (let i = 1; i <= total; i++) {
        doc.setPage(i).setFont('helvetica', 'normal').setFontSize(8).setTextColor(130);
        doc.text(`SKU ${pdfText(p.sku)} - Página ${i} de ${total}`, M, H - 8);
      }
      doc.save(`producto-${String(p.sku).replace(/[^\w.-]+/g, '_')}.pdf`);
    }
  </script>
</body>
</html>
